<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Theme: apply class before paint to prevent flash -->
    <script>
      (function () {
        // Light is the default theme. Dark only applies when the user has
        // explicitly chosen it via the toggle (saved in localStorage).
        // The OS setting (prefers-color-scheme) is intentionally ignored.
        if (localStorage.getItem('eds-theme') === 'dark') {
          var el = document.documentElement;
          el.classList.add('dark');
          el.style.colorScheme = 'dark';
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <!-- Default title & description; react-helmet-async overrides these per page -->
    <title>Everyday Digital Solutions — AI & Custom Software Studio · Mohali, India</title>
    <meta name="description" content="Senior-led custom software, AI voice agents, and automation systems for ambitious service businesses across Chandigarh, Mohali & Jalandhar. Shipped in 30 days." />
    <meta name="theme-color" content="#FAFAF8" />
    <meta name="color-scheme" content="light" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/favicon-512.png" />
    <!-- Preconnect for font + image performance. `crossorigin` is required on the
         gstatic preconnect for the font files; without it the connection is
         re-established when the actual font request fires. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preload the WebP logo so the navbar (LCP-adjacent) paints without a network round-trip. -->
    <link rel="preload" as="image" href="/logo.webp" type="image/webp" fetchpriority="high" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
